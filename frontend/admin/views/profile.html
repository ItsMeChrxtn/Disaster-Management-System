<section id="view-profile" class="view hidden"><h1 class="text-2xl font-bold">Profile & security</h1><div class="mt-5 grid gap-5 xl:grid-cols-2"><form id="profileForm" class="space-y-4 rounded-2xl border bg-white p-6"><h2 class="font-semibold">Profile details</h2><label class="block">Full name<input name="fullname" required placeholder="Full name"></label><label class="block">Email<input name="email" type="email" required placeholder="Email"></label><div class="grid grid-cols-2 gap-3"><label class="block">Phone<input name="phone" placeholder="Phone"></label><label class="block">Address<input name="address" placeholder="Address"></label></div><div class="grid grid-cols-2 gap-3"><label class="block">Municipality ID<input name="municipality_id" type="number" min="1" placeholder="Municipality ID"></label><label class="block">Barangay<input name="barangay" placeholder="Barangay"></label></div><button class="button button-primary">Update profile</button></form><form id="passwordForm" class="space-y-4 rounded-2xl border bg-white p-6"><h2 class="font-semibold">Change password</h2><label class="block">Current password<input name="current_password" type="password" required placeholder="Current password"></label><label class="block">New password<input name="password" type="password" minlength="8" required placeholder="New password"></label><label class="block">Confirm new password<input name="password_confirmation" type="password" minlength="8" required placeholder="Confirm new password"></label><button class="button button-primary">Change password</button></form></div></section>
