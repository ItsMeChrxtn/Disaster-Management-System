<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Disaster Map</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/tailwind.css?v=20261001-ds3">
  <link rel="stylesheet" href="assets/css/theme.css?v=20261001-ds3">
</head>
<body class="auth-shell">
  <main class="auth-panel auth-panel-solo">
    <div class="auth-card solo">
      <a href="index.html" class="brand-mark">
        <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span>
        <span class="brand-text"><strong>Disaster Map</strong><small>Cavite Readiness Hub</small></span>
      </a>
      <p class="eyebrow">Secure credential update</p>
      <h1>Choose a new password</h1>
      <p class="intro">Use at least eight characters and avoid passwords used on other services.</p>
      <form id="resetForm" class="auth-form">
        <label>Reset token<input name="token" required autocomplete="off" placeholder="Secure reset token"></label>
        <label>New password
          <div class="password-field">
            <input id="newPassword" name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters">
            <button type="button" class="password-toggle" data-password-toggle="newPassword">Show</button>
          </div>
        </label>
        <label>Confirm password<input name="password_confirmation" type="password" minlength="8" required autocomplete="new-password" placeholder="Repeat the new password"></label>
        <button type="submit" class="button button-primary">Update password</button>
      </form>
      <div class="auth-links"><a href="login.html" class="muted">&larr; Back to sign in</a></div>
    </div>
  </main>
  <script src="vendor/sweetalert2/sweetalert2.all.min.js?v=11"></script>
  <script src="config.js?v=20260920-ds1"></script>
  <script src="assets/js/api.js?v=20260920-ds1"></script>
  <script src="assets/js/alerts.js?v=20261024-r3"></script>
  <script src="assets/js/auth-pages.js?v=20260920-ds1"></script>
</body>
</html>
